name: GhostTrace CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3. Cache Gradle
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      # 4. Grant execute permission
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # 5. Build debug APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      # 6. Upload debug APK as artifact
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GhostTrace-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  release:
    name: Release APK
    runs-on: ubuntu-latest
    # Only run release job on push to main (not PRs)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Build release APK (unsigned — no keystore needed for sideloading)
      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      # Get short commit SHA for tag
      - name: Get short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      # Create GitHub Release and attach APK
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}-${{ steps.sha.outputs.short }}
          name: "GhostTrace v${{ github.run_number }} (@princeyy)"
          body: |
            ## 👻 GhostTrace — Auto Build #${{ github.run_number }}
            by **@princeyy**

            **Commit:** `${{ github.sha }}`
            **Branch:** `${{ github.ref_name }}`

            ### What's in this build
            - 👻 Usage log ghost detection
            - ⚙ Background service scanner
            - 🔍 /proc filesystem scanner
            - Dark terminal UI + session timeline chart

            ### Install
            Download `GhostTrace-release.apk` → install on device
            > Enable "Install unknown apps" for your file manager first
          files: app/build/outputs/apk/release/app-release-unsigned.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
